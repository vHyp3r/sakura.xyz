services:
  - type: web
    name: sakura-xyz
    env: node
    plan: free
    buildCommand: npm install && npm run build-css
    startCommand: node server.js
    autoDeploy: true
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: ACCOUNTINFO_DB_NAME
        value: accountInfo
      - key: ACCOUNT_SESSION_SECRET
        sync: false
      - key: NODE_ENV
        value: production
      - key: FIREBASE_PROJECT_ID
        value: sakura-auth-66415
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: ADMIN_USERNAMES
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_SESSION_SECRET
        sync: false
