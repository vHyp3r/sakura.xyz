<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pack Validator</title>
    <style> 
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .error {
            color: rgb(120, 133, 213);
        }

        .success-message {
            color: green;
        }
    </style>
</head>
<body>
    <h1>Pack Validator</h1>
    <form id="packForm">
        <label for="packInput">Enter Pack Data:</label><br>
        <input type="text" id="packInput" name="packInput" required><br><br>
        <input type="submit" value="Validate">
    </form>
    <div id="result"></div>

    <script>
        document.getElementById('packForm').addEventListener('submit', function(event) {
            event.preventDefault();
            const input = document.getElementById('packInput').value;
            const resultDiv = document.getElementById('result');

            if (input.trim() === '') {
                resultDiv.innerHTML = '<div class="error-message">Error: Input cannot be empty.</div>';
            } else {
                resultDiv.innerHTML = '<div class="success-message">Success: Valid input!</div>';
            }
        });
    </script>
</body>
</html>
