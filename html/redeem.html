<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Redeem a rank key</title>
  <link rel="stylesheet" href="/admin-assets/shop.css">
</head>
<body>
  <nav class="section-nav" aria-label="Sakura sections"><a href="/">🌸 sakura<span>.xyz</span></a><div class="links"><a href="/shop">Shop</a><a class="active" href="/redeem">Redeem</a><a href="/profile">Profile</a></div></nav>
  <main class="sakura-shop redeem-page">
    <h1>Redeem a rank key</h1>
    <p class="shop-sub">Paste the key you received from the shop or a verified donation.</p>
    <form id="redeem-form" class="redeem-form">
      <label for="rank-key">Rank key</label>
      <input id="rank-key" name="key" required pattern="[A-Za-z0-9]{5}(?:-[A-Za-z0-9]{5}){2}" placeholder="AAAAA-A8A6-99999" autocomplete="off">
      <button class="shop-buy" type="submit">Redeem key</button>
    </form>
    <p id="redeem-message" class="shop-message" aria-live="polite"></p>
    <section id="my-keys">
      <h2>My rank keys</h2>
      <p class="shop-sub">Keys purchased, issued, or redeemed by this account remain available here.</p>
      <div id="my-keys-list" class="shop-message" aria-live="polite">Loading your keys…</div>
    </section>
    <p><a href="#key-status" id="show-status">Check whether a key has already been redeemed</a></p>
    <section id="key-status" hidden>
      <form id="status-form" class="redeem-form">
        <label for="status-key">Key to check</label>
        <input id="status-key" name="key" required pattern="[A-Za-z0-9]{5}(?:-[A-Za-z0-9]{5}){2}" placeholder="BE606-4OFU8-XK26L" autocomplete="off">
        <button class="shop-buy" type="submit">Check key status</button>
      </form>
      <p id="status-message" class="shop-message" aria-live="polite"></p>
    </section>
  </main>
  <script>
    const form = document.querySelector('#redeem-form');
    const message = document.querySelector('#redeem-message');
    const statusSection = document.querySelector('#key-status');
    const statusForm = document.querySelector('#status-form');
    const statusMessage = document.querySelector('#status-message');
    const keysList = document.querySelector('#my-keys-list');
    const escapeHtml = (value) => String(value ?? '').replace(/[&<>'"]/g, (character) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[character]));
    const loadKeys = async () => {
      const response = await fetch('/api/ranks/keys');
      if (response.status === 401) {
        keysList.textContent = 'Sign in to view your rank keys.';
        return;
      }
      const result = await response.json();
      if (!response.ok) {
        keysList.textContent = result.error || 'Could not load your keys.';
        return;
      }
      keysList.innerHTML = result.keys.length
        ? result.keys.map((item) => `<div><strong>${escapeHtml(item.key || 'Unavailable')}</strong> — ${escapeHtml(item.rank)} — ${item.status === 'redeemed' ? 'Redeemed' : 'Available'}<small> ${new Date(item.createdAt).toLocaleString()}</small></div>`).join('')
        : 'No rank keys have been issued to this account yet.';
    };
    document.querySelector('#show-status').addEventListener('click', () => {
      statusSection.hidden = false;
      document.querySelector('#status-key').focus();
    });
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      message.textContent = 'Redeeming key…';
      const response = await fetch('/api/ranks/redeem', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ key: form.key.value })
      });
      const result = await response.json();
      message.textContent = response.ok ? `Success! Your ${result.rank.label} rank is now active.` : (result.error || 'Could not redeem this key.');
      if (response.ok) form.reset();
      if (response.ok) loadKeys();
    });
    statusForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      statusMessage.textContent = 'Checking key…';
      const response = await fetch(`/api/ranks/key-status?key=${encodeURIComponent(statusForm.key.value)}`);
      const result = await response.json();
      statusMessage.textContent = result.status === 'available'
        ? 'This key is valid and available to redeem.'
        : result.status === 'redeemed'
          ? 'This key has already been redeemed and cannot be used again.'
          : 'This key is not valid.';
    });
    loadKeys();
  </script>
</body>
</html>
