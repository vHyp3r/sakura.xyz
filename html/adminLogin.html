<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin sign in | Sakura</title>
    <style>
        :root { --bg:#0b1113; --card:#11191c; --line:#263237; --text:#f2f6f4; --muted:#8c9a9d; --mint:#9ee2bd; --coral:#ff806b; }
        * { box-sizing:border-box; } body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:radial-gradient(circle at 20% 10%,#18302d 0,transparent 35%),var(--bg); color:var(--text); font:14px/1.5 'DM Sans',ui-sans-serif,sans-serif; }
        .card { width:min(420px,100%); padding:34px; background:rgba(17,25,28,.96); border:1px solid var(--line); border-radius:12px; box-shadow:0 24px 80px #0008; } .mark { display:grid; place-items:center; width:38px; height:38px; margin-bottom:26px; border:2px solid var(--mint); border-radius:12px 4px 12px 4px; color:var(--mint); font-weight:700; transform:rotate(-8deg); } h1 { margin:0; font:700 28px 'Space Grotesk',ui-sans-serif,sans-serif; } p { color:var(--muted); margin:8px 0 28px; } label { display:block; margin-top:17px; color:var(--muted); font-size:12px; font-weight:700; } input { width:100%; margin-top:7px; padding:12px; border:1px solid var(--line); border-radius:7px; outline:0; background:#0d1517; color:var(--text); } input:focus { border-color:var(--mint); } button { width:100%; margin-top:24px; padding:12px; border:0; border-radius:7px; background:var(--mint); color:var(--bg); font-weight:700; cursor:pointer; } button:disabled { opacity:.6; cursor:wait; } .error { min-height:20px; color:var(--coral); margin:14px 0 0; font-size:12px; } .back { display:block; margin-top:20px; color:var(--muted); text-align:center; text-decoration:none; font-size:12px; }
    </style>
</head>
<body>
    <main class="card">
        <div class="mark">S</div>
        <h1>Admin sign in</h1>
        <p>Use your administrator credentials to open the Sakura control room.</p>
        <form id="loginForm">
            <label>Admin username<input name="username" type="text" autocomplete="username" required></label>
            <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
            <button type="submit">Continue to control room</button>
            <div id="error" class="error" role="alert"></div>
        </form>
        <a class="back" href="/">← Back to Sakura</a>
    </main>
    <script>
        const form = document.querySelector('#loginForm');
        const error = document.querySelector('#error');
        const returnTo = new URLSearchParams(location.search).get('returnTo') || '/admin';
    const username = new URLSearchParams(location.search).get('username');
    if (username) form.username.value = username;
        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            const button = form.querySelector('button');
            button.disabled = true;
            error.textContent = '';
            try {
                const response = await fetch('/api/admin/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(Object.fromEntries(new FormData(form))) });
                const result = await response.json();
                if (!response.ok) throw new Error(result.error || 'Unable to sign in.');
                location.href = returnTo.startsWith('/') ? returnTo : '/admin';
            } catch (loginError) {
                error.textContent = loginError.message;
                button.disabled = false;
            }
        });
    </script>
</body>
</html>
